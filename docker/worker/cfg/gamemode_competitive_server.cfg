// CS2 runs this on every map load, AFTER gamemode_competitive.cfg and before SourceTV joins.
//
// The bot quota settings must live here, not in botlab.cfg:
// - the competitive game mode resets bot_quota_mode to "competitive" on each load, which
//   fills the server with random bots;
// - setting bot_quota_mode mid-map (even to the same value) makes CS2's quota logic kick
//   SourceTV, which cannot rejoin before the next map load, so demos come out empty.
bot_quota_mode normal
bot_quota 0
bot_join_after_player 0
bot_auto_vacate 0
bot_join_team any
