// Executed by the orchestrator before every match (`exec botlab`).
sv_lan 1
sv_hibernate_when_empty 0

// Bot quota settings are in gamemode_competitive_server.cfg: changing them mid-map kicks SourceTV.
bot_chatter off

mp_autoteambalance 0
mp_limitteams 0
mp_warmuptime 0
mp_halftime 1
mp_overtime_enable 0
mp_match_can_clinch 1
// Time after the final round before the server moves on; the orchestrator stops the demo in it.
mp_match_restart_delay 30
mp_endmatch_votenextmap 0

tv_delay 0
tv_transmitall 1
