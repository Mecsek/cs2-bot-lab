[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
lab-core = { path = "crates/lab-core" }
features = { path = "crates/features" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.10"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"] }
tokio-tungstenite = "0.30"

# Pinned protobuf definitions; see vendor/csgoproto/build.rs.
[patch."https://github.com/LaihoE/demoparser"]
csgoproto = { path = "vendor/csgoproto" }
